buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.9.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Substitute retired com.arthenica:ffmpeg-kit-https dependency with active community fork io.github.maitrungduc1410:ffmpeg-kit-https
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute module("com.arthenica:ffmpeg-kit-https") using module("io.github.maitrungduc1410:ffmpeg-kit-https:6.0.1")
        }
    }
}
